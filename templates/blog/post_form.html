{% extends 'shared/layout.html' %}

{% block title %}
{{ title }}
{% endblock title %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ title }}</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
            <input type="text" name="title" value="{{ form.title.value|default:'' }}" required 
                   class="w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Featured Image</label>
            <input type="file" name="featured_image" accept="image/*" 
                   class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
            <select name="status" class="w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-indigo-500">
                <option value="draft" {% if form.status.value == 'draft' %}selected{% endif %}>Draft</option>
                <option value="published" {% if form.status.value == 'published' %}selected{% endif %}>Published</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Content</label>
            <textarea name="content" rows="8" required 
                      class="w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ form.content.value|default:'' }}</textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="{% url 'dashboard' %}" class="px-4 py-2 border border-slate-300 rounded-md text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm font-medium hover:bg-indigo-500">Save Post</button>
        </div>
    </form>
</div>
{% endblock content %}
