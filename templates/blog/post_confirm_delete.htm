{% extends 'shared/layout.html' %}

{% block title %}
Delete Post - DevBlog
{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-0 py-8 sm:py-12">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-4">
        
        <!-- Warning Icon -->
        <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <!-- Confirmation Text -->
        <div>
            <h1 class="text-xl font-bold text-slate-900">Delete Post</h1>
            <p class="text-xs sm:text-sm text-slate-600 mt-2 leading-relaxed">
                Are you sure you want to delete <strong class="text-slate-900 wrap-break-word">"{{ post.title }}"</strong>? This action is permanent and cannot be undone.
            </p>
        </div>

        <!-- Form & Actions -->
        <form method="POST" class="pt-2 flex flex-col-reverse sm:flex-row sm:justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 transition duration-150">
                Cancel
            </a>
            <button type="submit" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 bg-red-600 text-white rounded-lg text-sm font-semibold shadow-sm hover:bg-red-500 transition duration-150">
                Delete Post
            </button>
        </form>
        
    </div>
</div>
{% endblock content %}
